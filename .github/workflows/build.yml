name: build-exp-system

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build
        run: gradle clean build --stacktrace
      - name: Dedicated server smoke test
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          set +e
          timeout 90s gradle runServer --args='nogui' > /tmp/exp-system-server.log 2>&1
          CODE=$?
          set -e
          cat /tmp/exp-system-server.log
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then exit "$CODE"; fi
          if grep -E -i 'mixin apply failed|mixin.*error|invalid injection|injection error|exception.*exp_system|failed to load.*exp_system' /tmp/exp-system-server.log; then exit 1; fi
          grep -q 'Done (' /tmp/exp-system-server.log || { echo 'Server never reached ready state.'; exit 1; }
      - name: TACZ 26.2 compatibility smoke
        run: |
          rm -rf run/world run/mods
          mkdir -p run/mods
          echo 'eula=true' > run/eula.txt
          curl -fL --retry 3 \
            'https://github.com/q14433686-arch/TaCZ_Refabricated_Unofficial/releases/download/26.2_R2_HOTFIX-2/TACZ-Refabricated-26.2-1.1.8%2Bfabric.26.2.R2-hotfix2.jar' \
            -o run/mods/tacz.jar
          set +e
          timeout 120s gradle runServer --args='nogui' > /tmp/exp-system-tacz-server.log 2>&1
          CODE=$?
          set -e
          cat /tmp/exp-system-tacz-server.log
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then exit "$CODE"; fi
          if grep -E -i 'mixin apply failed|mixin.*error|invalid injection|injection error|exception.*exp_system|failed to load.*exp_system' /tmp/exp-system-tacz-server.log; then exit 1; fi
          grep -q 'tacz' /tmp/exp-system-tacz-server.log || { echo 'TACZ was not detected by Fabric Loader.'; exit 1; }
          grep -q 'Done (' /tmp/exp-system-tacz-server.log || { echo 'TACZ smoke server never reached ready state.'; exit 1; }
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: exp-system-build
          path: build/libs/*.jar
